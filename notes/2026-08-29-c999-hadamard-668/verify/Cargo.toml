[package]
name = "had668"
version = "0.1.0"
edition = "2021"
description = "Verification and structural classification of Hadamard matrices (built for order 668)"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
