[package]
name = "sparse-shadow-nauty"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Optional nauty cross-check backend for sparse-shadow"

[dependencies]
blake3 = "1.8"
nauty-Traces-sys = "0.11.0"
serde_json = "1.0"
sparse-shadow-core = { path = "../../crates/sparse-shadow-core", version = "0.1.0" }
thiserror = "2.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
