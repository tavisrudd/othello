[package]
name = "ergodis-private"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
publish = false

[features]
default = []
c1018-sparse-action = []
c1018-lane-action = []

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ergodis = { path = "../papers/complete-repair-ports/ergodis", features = ["control-plane", "parallel"] }
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[[bin]]
name = "projective-grid-scout"
path = "src/bin/projective_grid_scout.rs"

[[bin]]
name = "alignment-controlled"
path = "src/bin/alignment_controlled.rs"

[[bin]]
name = "hall-certify"
path = "src/bin/hall_certify.rs"

[[bin]]
name = "q25-pair-repair"
path = "src/bin/q25_pair_repair.rs"

[[bin]]
name = "q16-quadratic"
path = "src/bin/q16_quadratic.rs"

[[bin]]
name = "q19-marked-polar"
path = "src/bin/q19_marked_polar.rs"
