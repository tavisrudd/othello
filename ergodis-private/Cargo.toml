[workspace]
members = [".", "tasks/gem-hunt", "tasks/tools"]

[package]
name = "ergodis-private"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
publish = false

[features]
default = []

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ergodis = { path = "../papers/complete-repair-ports/ergodis", features = ["control-plane", "parallel"] }
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
