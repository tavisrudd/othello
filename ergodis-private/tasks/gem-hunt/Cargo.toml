[package]
name = "gem-hunt"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
publish = false

[features]
default = []
# Select the monomorphized binary projective-linear action pack used by the
# `prs census` dense binary orbit worker.  Kept as compile-time features rather
# than runtime flags: the worker carries a fixed `export_name` and its isolated
# radix win does not survive a trait-shared body under fat LTO.
c1018-sparse-action = []
c1018-lane-action = []

[[bin]]
name = "gem-hunt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ergodis = { path = "../../../papers/complete-repair-ports/ergodis", features = ["control-plane", "parallel"] }
ergodis-private = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
