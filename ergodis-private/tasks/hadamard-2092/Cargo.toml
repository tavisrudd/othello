[package]
name = "hadamard-2092"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
publish = false

[[bin]]
name = "hadamard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ergodis = { path = "../../../papers/complete-repair-ports/ergodis", features = ["control-plane", "parallel"] }
ergodis-private = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
