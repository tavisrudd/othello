[package]
name = "certdist-build"
version = "0.0.0"
edition = "2021"
publish = false

# Out-of-tree build shim. The authoritative source is
# /home/tavis/src/othello/ergodis-private/src/bin/certdist.rs; this crate only
# exists so the binary can be built while a sibling session's in-flight edits
# leave the ergodis-private library target uncompilable. certdist.rs uses no
# ergodis-private library item, so the two builds are byte-equivalent.
[[bin]]
name = "certdist"
path = "/home/tavis/src/othello/ergodis-private/src/bin/certdist.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
