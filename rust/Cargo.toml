[package]
name = "othello"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust 8x8 Othello engine: bitboards, black-centred search, PVS strong engine"

[lib]
name = "othello"
path = "src/lib.rs"

[[bin]]
name = "othello"
path = "src/main.rs"

# The adversarial Non-Attacking Queens game (Noon & Van Brummelen, 2006).
[[bin]]
name = "queens"
path = "src/bin/queens.rs"

# Ultra-fast release build: whole-program inlining + single codegen unit.
# `target-cpu=native` (see .cargo/config.toml) turns on POPCNT/BMI for the hot
# bit primitives (count_ones, blsi, tzcnt).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Same codegen as release but with debug symbols, for `perf`.
[profile.profiling]
inherits = "release"
debug = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rayon = "1.12.0"
signal-hook = "0.3"
terminal_size = "0.4"
# Compresses the TT checkpoint images (mostly-zero early ⇒ highly compressible);
# the search hot path never touches it. Stream-encode/decode (proposal Approach A).
zstd = "0.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
