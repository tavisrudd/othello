name = "NodeKayles"
defaultTargets = ["NodeKayles", "Sumfree", "CapGame", "ProjectiveCap", "Queens", "FiniteGeom", "RepairCodes", "DihedralSchreier"]

# mathlib (Finset, Equiv, card lemmas; Nat.find/Nat.xor for the self-contained Grundy layer).
# Note: mathlib v4.32 no longer ships SetTheory/Game/ (PGame/Sprague–Grundy were extracted to
# the standalone CombinatorialGames package), so Phase 4 is built self-contained.
# Pinned to the exact rev that matches lean-toolchain v4.32.0-rc1 (also in lake-manifest.json) so
# the build is reproducible; bump to a release tag + stable toolchain when v4.32.0 ships. Do NOT
# `lake update` on a checkout — it would re-float to master and break the toolchain pin.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "571b8a8e54219b4d393f75f4b8653fac08197fcc"

[[lean_lib]]
name = "NodeKayles"

[[lean_lib]]
name = "Sumfree"

[[lean_lib]]
name = "CapGame"

[[lean_lib]]
name = "ProjectiveCap"

[[lean_lib]]
name = "Queens"

# Coding/MDS formalization program (notes/handoffs/2026-07-11-lean-formalization-plan.md).
[[lean_lib]]
name = "FiniteGeom"

[[lean_lib]]
name = "RepairCodes"

# Fixed-point-deleted Schreier templates from tame dihedral conic triples.
[[lean_lib]]
name = "DihedralSchreier"
