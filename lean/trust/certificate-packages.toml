# Generated families still resident in the monorepo, each named with the official package
# that will own it.  A generated source outside both the owned prefixes above and these
# prefixes is a family that was never declared, and is rejected.  These declarations are
# the remaining externalization scope: this table is empty exactly when it is finished.
#
# `disposition` is `external-pending` when the owning package is decided, and
# `resident-unclassified` when the source is generated but its ownership has not been
# determined.  Neither may survive closeout.  Generated data that a determination keeps
# here permanently belongs in `resident_family` below instead.

[[pending_family]]
name = "order-11 projective-cap reply-book certificates"
owner = "finitegeom-projective-cap-q11-certificates"
disposition = "external-pending"
path_prefixes = [
  "lean/ProjectiveCap/CertData/Q11.lean",
  "lean/ProjectiveCap/CertData/Q11Assembly.lean",
  "notes/2026-07-07-anchored-cert-to-lean.py",
  "notes/2026-07-08-q11-assembly-to-lean.py",
]

