# Generated data that a written determination keeps in the monorepo, because it is
# human-scale semantic source rather than certificate payload: a frozen finite table
# small enough to read, carrying no generated proof, consumed by hand-written theorems
# in its own area.  Unlike `pending_family`, this table is permanent, so every entry
# names the determination that admits it.

[[resident_family]]
name = "frozen Clebsch rank-three and scheme-Fourier tables"
determination = "notes/2026-08-05-c864-base-generated-module-classification.md"
path_prefixes = [
  "lean/RelativeConicArcs/ClebschArithmeticGluingData.lean",
  "lean/RelativeConicArcs/ClebschSchemeFourierData.lean",
  # The generators of those two tables stay for the same reason the tables do: a
  # frozen human-scale table is only reviewable beside the program that wrote it.
  "lean/verification/clebsch_arithmetic_gluing/",
  "lean/verification/clebsch_scheme_fourier/",
]
