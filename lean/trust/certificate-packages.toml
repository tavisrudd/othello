# The non-Lean half of the same family: the generators that write those modules, the
# independent replay programs, the replay checker, and the canonical data the checker
# reads.  Every one of them moves with the family under the ownership boundary, so
# they are declared here rather than left invisible to the boundary check — which
# scans `lean` and `papers` only and would never have reached `notes/`.  The dated
# `notes/*-c151-*.md` reports are research records and stay; only executable payload
# and its data are listed.  Determination:
# notes/2026-08-05-c864-non-lean-payload-and-build-artifact-sweep.md
[[pending_family]]
name = "order-25 generators, replay programs, and replay data"
owner = "finitegeom-q25-certificates"
