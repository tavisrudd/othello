# Generated families still resident in the monorepo, each named with the official package
# that will own it.  A generated source outside both the owned prefixes above and these
# prefixes is a family that was never declared, and is rejected.  These declarations are
# the remaining externalization scope: this table is empty exactly when it is finished.
#
# `disposition` is `external-pending` when the owning package is decided, and
# `resident-unclassified` when the source is generated but its ownership has not been
# determined.  Neither may survive closeout.  Generated data that a determination keeps
# here permanently belongs in `resident_family` below instead.

[[pending_family]]
name = "order-13 passant-code certificates"
owner = "finitegeom-projective-cap-q13-certificates"
disposition = "external-pending"
path_prefixes = ["papers/q13-passant-code/lean-certificates/"]

# Generated data that a written determination keeps in the monorepo, because it is
# human-scale semantic source rather than certificate payload: a frozen finite table
# small enough to read, carrying no generated proof, consumed by hand-written theorems
# in its own area.  Unlike `pending_family`, this table is permanent, so every entry
# names the determination that admits it.

[[resident_family]]
name = "frozen Clebsch rank-three and scheme-Fourier tables"
determination = "notes/2026-08-05-c864-base-generated-module-classification.md"
path_prefixes = [
  "lean/RelativeConicArcs/ClebschArithmeticGluingData.lean",
  "lean/RelativeConicArcs/ClebschSchemeFourierData.lean",
  # The generators of those two tables stay for the same reason the tables do: a
  # frozen human-scale table is only reviewable beside the program that wrote it.
  "lean/verification/clebsch_arithmetic_gluing/",
  "lean/verification/clebsch_scheme_fourier/",
]
