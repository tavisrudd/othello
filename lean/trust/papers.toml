# Paper registry for the trust spine.
#
# Everything here is a DECLARATION.  Nothing in this file is evidence, and — with one deliberate
# exception noted below — nothing here restates a fact that lives in a manuscript.
#
# In particular there is no `title` field.  A paper's title exists in exactly one place, the
# `\title{}` argument of its main source, and every other artifact that names the paper is checked
# against that string rather than against a copy of it kept here.  Adding a title to this file
# would create the very drift the paper layer exists to catch.
#
# A row therefore declares only pointers and adoption:
#
#   id                  stable identifier for the manuscript, used to name its facts artifact
#   dir                 repository-relative directory
#   main                the source inside `dir` carrying `\title{}`; one row per manuscript, so a
#                       directory holding a journal variant beside the preprint gets two rows
#   lane                the lane that owns the manuscript and repairs drift reported against it
#
# and, written by that owning lane rather than by the paper layer:
#
#   superseded_titles   titles this paper used to have.  Any tracked file under a drift scan root
#                       that still states one is reported.  This is the exception mentioned above:
#                       a dead title has no other home, because the manuscript no longer contains
#                       it.  Remove an entry once the tree is clean, not before.
#   adopted_labels      statement labels the paper advertises as its headline claims
#   manifest            per-paper verification manifest, relative to `dir`
#   manifest_labels     where that manifest's claim labels live, as `<key>[].<key>`
#   lean_terminals      fully qualified Lean declarations the paper cites
#
# The optional fields are empty for every row below.  The paper layer registers manuscripts, which
# is a mechanical pointer; it does not decide which of another lane's claims are headline claims,
# which labels its manifest adopts, or which Lean terminals it leans on.  Those are the owning
# lane's to add, and each one turns on a further check.

schema_version = 1

[repository]
# A bibliography entry naming one of these authors is a self-citation: it must quote a registered
# manuscript's current title, or be declared an external publication below.
self_authors = ["Rudd"]

# Directories whose immediate subdirectories are candidate manuscripts.  A subdirectory holding a
# top-level source with a `\title{}` and no row below is reported as unregistered.
paper_roots = ["papers"]

# Roots scanned for superseded titles.  Bounded on purpose: the scan reads every tracked text file
# underneath, so widening it to the repository root would read generated data trees for no benefit.
drift_scan_roots = ["papers", "notes", "lean"]

# ---------------------------------------------------------------------------------------------
# Self-authored bibliography entries that are not repository manuscripts.
#
# Each entry here suppresses a citation check, so each needs a reason a reviewer can act on.  An
# entry whose companion paper simply has not been registered yet does not belong here.

# (none declared)

# ---------------------------------------------------------------------------------------------
# Documents that name manuscripts by title.
#
# `papers` declares which manuscripts a document undertakes to name. That is an editorial fact
# about coverage, and it is the only thing declared: the titles themselves stay in the manuscripts,
# and each listed paper's current `\title{}` must appear in the document or it is drift. Omitting
# `papers` means the document covers the whole portfolio.
#
# These entries are read-only checks. Inserting generated regions into a file another lane owns is
# a separate step needing that lane's owner, exactly as `portfolio.toml` records for the per-area
# manifests; checking that a file states current titles edits nothing and needs no such agreement.

[[title_restating_doc]]
path = "notes/2026-07-09-work-summary.md"

[[title_restating_doc]]
path = "papers/papers-index.md"

# The results snapshot is a self-contained editorial document that deliberately covers a subset:
# the integrated Clebsch manuscript is preserved only as a fallback and the Node Kayles paper sits
# outside its scope, so neither is named there.
[[title_restating_doc]]
path = "notes/2026-07-26-results-summary-snapshot.md"
papers = [
  "ame_lu",
  "arcs_complete_outside_conic",
  "beyond4_prs",
  "beyond4_prs_submission",
  "clebsch_factorization",
  "clebsch_passages",
  "clebsch_rigidity",
  "clebsch_rigidity_companion",
  "complete_repair_ports",
  "continuation_graph_rigidity",
  "equivariant_robust_completion",
]

# ---------------------------------------------------------------------------------------------
# Generated Markdown regions.
#
# Only tabular facts belong inside a region. Every document carrying one also carries judgement —
# what is ready, what is blocked, what is worth publishing — and that judgement stays hand-written
# outside the markers. A document whose argument is generated is worse than one that drifts,
# because drift is visible and generated argument is not.

[[generated_doc]]
path = "notes/2026-07-09-work-summary.md"
section = "manuscripts"

# ---------------------------------------------------------------------------------------------
