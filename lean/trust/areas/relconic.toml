# ---------------------------------------------------------------------------------------------
# Terminals.
#
# Only declarations whose fully-qualified name has been confirmed against the source namespace
# stack are listed.  The remaining terminals named in prose in `RelativeConicArcs/TRUST.md` are
# deliberately absent until extraction resolves their exact names: a guessed name would produce a
# green check for a declaration that does not exist.
#
# `pair_extension` sits in two gates on purpose.  It is the multi-gate case the schema has to
# support, since the Baer and Q25 gates cannot be compiled into one environment.

[[terminal]]
declaration = "RelativeConicArcs.Certificate.check_sound"
gates = ["RelativeConicArcs.Gates.Relconic"]
expected_axioms = ["Classical.choice", "Quot.sound", "propext"]

[[terminal]]
declaration = "RelativeConicArcs.Q25AllProfiles.pair_extension"
gates = [
  "RelativeConicArcs.Gates.Baer",
  "RelativeConicArcs.Gates.AlternateOrbitRepairQ25",
]
expected_axioms = ["Classical.choice", "Quot.sound", "propext"]

# ---------------------------------------------------------------------------------------------
# Owned modules that no declared extraction unit reaches.
#
# Each entry is a statement that the gap is known and why.  Nothing here is audited: these modules
# are not in any gate closure, so no gate build kernel-checks them and no terminal depends on them.
# They appear in the unaudited-modules table for exactly that reason.  Removing an entry once its
# work lands is how the tree stops being invisible.

[[unreached]]
modules = [
  "RelativeConicArcs.Q25ResidualClassLinkData.**",
  "RelativeConicArcs.Q25ResidualConclusionData.**",
  "RelativeConicArcs.Q25ResidualCoverData.**",
  "RelativeConicArcs.Q25ResidualCoverPrototype.**",
  "RelativeConicArcs.Q25ResidualDispatchData.**",
  "RelativeConicArcs.Q25ResidualTransportData.**",
  "RelativeConicArcs.Q25RowCompositionData.**",
  "RelativeConicArcs.Q25ClassBoundData.**",
  "RelativeConicArcs.Q25LineMaskData.**",
  "RelativeConicArcs.Q25CarrierLineData.**",
  "RelativeConicArcs.Q25ExactMinimumRows.**",
  "RelativeConicArcs.Q25Residual**",
  "RelativeConicArcs.Q25Minimum**",
  "RelativeConicArcs.Q25Row**",
  "RelativeConicArcs.Q25Line**",
  "RelativeConicArcs.Q25Exactness**",
]
severity = "info"
reason = """\
In-flight Q25 residual-orbit work owned by the relconic lane; no gate imports it yet, so it is \
outside every audited closure.  This exclusion is a status report, not an exemption: it must be \
removed and the trees brought under a gate when that work lands."""

[[unreached]]
modules = [
  "RelativeConicArcs.Q11A5**",
  "RelativeConicArcs.Q11Dye**",
  "RelativeConicArcs.Q11Klein**",
  "RelativeConicArcs.Q11Brianchon**",
  "RelativeConicArcs.Clebsch**",
  "RelativeConicArcs.ReflectionArrangement**",
  "RelativeConicArcs.SixVertex**",
  "RelativeConicArcs.Q5Six**",
]
severity = "info"
reason = """\
Clebsch/A5 orbit exploration reached through the two declared Dye axioms.  It is not paper-facing \
through this area's gates and `lean/RelativeConicArcs/TRUST.md` makes no audit claim about it."""

[[unreached]]
modules = ["RelativeConicArcs"]
severity = "info"
reason = "library root aggregator; gates import the specific terminals they need, never the root"

# ---------------------------------------------------------------------------------------------
# Named external inputs.  Reviewer declarations; the checker verifies only that the stated entry
# declarations exist in some extraction unit and that an `axiom` entry mode agrees with Lean.

[[external_input]]
name = "Kim-Vu complete-arc bound"
entry_mode = "hypothesis"
entry_declarations = []
anchor = "RelativeConicArcs/TRUST.md#explicit-external-boundary"

[[external_input]]
name = "NRC/GRS dictionary"
entry_mode = "consistency-check"
entry_declarations = []
anchor = "RelativeConicArcs/TRUST.md#explicit-external-boundary"

[[external_input]]
name = "Al-Seraji--Al-Ogali class count"
entry_mode = "consistency-check"
