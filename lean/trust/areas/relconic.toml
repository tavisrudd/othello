# Trust spine — arcs complete outside a conic, and the Q25 equivariant-repair work sharing its tree.
#
# Declared by a reviewer.  Read `lean/RelativeConicArcs/TRUST.md` for the prose manifest; this file
# is the machine-checkable subset of it.
#
# The member globs below were derived from the tracked tree at declaration time and then reviewed.
# They detect drift away from that snapshot; they say nothing about whether the snapshot is
# mathematically right.  Every tree here is `legacy-unverified`: none carries a provenance header,
# so its tracked bytes have an identity but no demonstrated regeneration.  Turning any of them
# `strict` is C324's job, not this file's.

schema_version = 1
area = "relconic"
manifest = "RelativeConicArcs/TRUST.md"

owns = ["RelativeConicArcs", "RelativeConicArcs.**"]

# No axiom is permitted in this area.  The ten-point six-arc concurrence bound and the equality
# classification of the arcs attaining it were once declared here; both are now theorems of
# RelativeConicArcs.SixArcConcurrence and RelativeConicArcs.Q11GoldenHexagonWitness.
permitted_axioms = []

# ---------------------------------------------------------------------------------------------
# Gates.  The relconic targets are independently compiled import-only modules, so completeness is
# defined over their union.  The AME--LU axiom audit imports its aggregate, while both remain
# explicit extraction units because the paper's reproducibility command builds both targets.

