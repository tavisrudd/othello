# The two-uniform and quantitative-rounding chain of the stabilizer-AME rigidity manuscript.
# It is reached through its own import-only gate rather than through the mixed AME--LU aggregate,
# because no result here enters the MDS--CSS transversal-group closure.  Every terminal is checked
# by kernel reduction; the approximate-decomposition terminal states its analytic inputs as
# structure fields rather than proving them.

