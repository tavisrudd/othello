# Trust spine — arcs complete outside a conic, and the Q25 equivariant-repair work sharing its tree.
#
# Declared by a reviewer.  Read `lean/RelativeConicArcs/TRUST.md` for the prose manifest; this file
# is the machine-checkable subset of it.
#
# The member globs below were derived from the tracked tree at declaration time and then reviewed.
# They detect drift away from that snapshot; they say nothing about whether the snapshot is
# mathematically right.  Every tree here is `legacy-unverified`: none carries a provenance header,
# so its tracked bytes have an identity but no demonstrated regeneration.  Turning any of them
# `strict` is C324's job, not this file's.

schema_version = 1
area = "relconic"
manifest = "RelativeConicArcs/TRUST.md"

owns = ["RelativeConicArcs", "RelativeConicArcs.**"]

# The two Dye axioms.  They are declared here so they appear in the portfolio axiom map, and they
# sit outside every gate closure, which the checker reports separately.  Declaring an axiom is not
# endorsing it.
permitted_axioms = [
  "RelativeConicArcs.ClebschDye.dye1991_brianchon_bound",
  "RelativeConicArcs.ClebschDye.dye1991_equality_classification",
]

# ---------------------------------------------------------------------------------------------
# Gates.  The relconic targets are independently compiled import-only modules, so completeness is
# defined over their union.  The AME--LU axiom audit imports its aggregate, while both remain
# explicit extraction units because the paper's reproducibility command builds both targets.

[[gate]]
module = "RelativeConicArcs.Gates.Relconic"
terminals = ["RelativeConicArcs.Certificate.check_sound"]
coverage_rule = "closure"

[[gate]]
module = "RelativeConicArcs.Gates.Baer"
terminals = ["RelativeConicArcs.Q25AllProfiles.pair_extension"]
coverage_rule = "closure"

[[gate]]
module = "RelativeConicArcs.Gates.AlternateOrbitRepairQ25"
terminals = ["RelativeConicArcs.Q25AllProfiles.pair_extension"]
coverage_rule = "closure"

[[gate]]
module = "RelativeConicArcs.Gates.AlternateOrbitRepairParameterized"
terminals = []
coverage_rule = "closure"

[[gate]]
module = "RelativeConicArcs.Gates.AlternateOrbitRepairProfileEnvelope"
terminals = []
coverage_rule = "closure"

[[gate]]
module = "RelativeConicArcs.Gates.AMELUAggregate"
terminals = []
coverage_rule = "closure"

[[gate]]
module = "RelativeConicArcs.Gates.AMELUAggregateAxioms"
terminals = []
coverage_rule = "closure"

[[gate]]
module = "RelativeConicArcs.Gates.AMELUDictionaryAxioms"
terminals = []
coverage_rule = "closure"

[[gate]]
module = "RelativeConicArcs.Gates.AMELUExtensionFieldPencil"
terminals = []
coverage_rule = "closure"

[[gate]]
