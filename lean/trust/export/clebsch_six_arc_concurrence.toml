# Area-export configuration for triple concurrence of a six-arc.
#
# The exporter derives the module closure, terminal list, and observed axioms
# from the trust registry and the generated fact of the declared gate.  Only
# the destination file names and the release prose live here.
#
# This is a boundary of its own rather than an addition to the golden
# orientation boundary of the Clebsch support cubic.  The two developments
# share no module and no terminal: this one is incidence geometry of six points
# and the fifteen chords they span in a projective plane, while the orientation
# boundary is about the antipodal cover, determinant pencil, and singular locus
# of a cubic threefold.  Keeping them apart also lets the downstream
# order-eleven certificate package pin exactly the boundary it consumes.

