# Area-export configuration for the matching-packing bounds and small
# odd-order witnesses added to the theory of arcs complete outside a conic.
#
# The exporter derives the module closure, terminal list, and observed axioms
# from the trust registry and the generated fact of the declared gate.  Only the
# destination file names and the release prose live here.
#
# This is a boundary of its own rather than part of the human Arcs boundary
# exported beside it: it adds quantitative packing bounds and explicit witnesses
# over three further field orders, and neither boundary uses the other's
# terminals.

schema_version = 1
area = "arcs_complete_outside_conic_additions"
