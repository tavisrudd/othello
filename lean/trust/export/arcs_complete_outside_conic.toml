# Area-export configuration for the human-scale library behind
# "Arcs complete outside a prescribed conic".
#
# The exporter derives the module closure, terminal list, and observed axioms
# from the trust registry and the generated fact of the declared gate.  Only the
# destination file names and the release prose live here.
#
# This boundary carries the reusable geometry and the kernel-checked step and
# reduction semantics.  The exhaustive order-sixteen transition, row, and leaf
# families are not part of it: they belong to the separately pinned
# finitegeom-q16-certificates package.  The downstream paper bridge imports
# both this human-scale library and that Mathlib-only certificate package.

schema_version = 1
area = "arcs_complete_outside_conic"
gate = "RelativeConicArcs.Gates.ArcsCompleteOutsideConic"
