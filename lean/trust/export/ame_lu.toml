# Area-export configuration for stabilizer-AME rigidity, operator-pushing
# atlases, and the MDS--CSS applications.
#
# The exporter derives the module closure, terminal list, and observed axioms
# from the trust registry and the generated fact of the declared gate.  Only the
# destination file names and the release prose live here.
#
# The audited declarations are printed by the sibling gate
# RelativeConicArcs.Gates.AMELUAggregateAxioms, which imports this one.  That
# module prints them under opened namespaces, so the registry records the
# fully-qualified names resolved against the extracted declaration set rather
# than the short forms as printed.

