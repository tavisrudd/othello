# Standalone release-repository map for C684.
#
# This file maps physical manuscript roots to local/GitHub repository identities. It does not
# authorize remote creation or publication. `papers/scripts/export-paper-repos.py` cross-checks
# paper IDs, source roots, and entry points against `lean/trust/papers.toml`.

schema_version = 1

[destinations]
local_root = "~/src/math-papers"
github_owner = "tavisrudd"

[[repository]]
name = "ame-lu"
source = "papers/ame_lu"
paper_ids = ["ame_lu"]
disposition = "active"

[[repository]]
name = "arcs-complete-outside-conic"
source = "papers/arcs_complete_outside_conic"
paper_ids = ["arcs_complete_outside_conic"]
disposition = "gated"
gate = "wait for the arcs manuscript boundary and Q16 build-sys package identity"

[[repository]]
name = "beyond4-prs"
source = "papers/beyond4_prs"
paper_ids = ["beyond4_prs", "beyond4_prs_submission"]
disposition = "active"

[[repository]]
name = "clebsch-factorization"
source = "papers/clebsch-factorization"
paper_ids = ["clebsch_factorization"]
disposition = "active"

[[repository]]
name = "clebsch-hexagon-code"
source = "papers/clebsch-hexagon-code"
paper_ids = ["clebsch_hexagon_code"]
disposition = "archive"

[[repository]]
name = "clebsch-passages"
source = "papers/clebsch-passages"
paper_ids = ["clebsch_passages"]
disposition = "active"

[[repository.rewrite]]
path = "verification/README.md"
old = "papers/clebsch-passages/"
new = ""
expected_count = 8
reason = "commands are executed from the standalone repository root after flattening"

