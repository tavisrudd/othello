[package]
name = "ergo-comp"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Exact compiler for hierarchical linear-code recovery costs and witnesses"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tavisrudd/complete-repair-ports"
keywords = ["coding-theory", "optimization", "storage", "recovery"]
categories = ["algorithms", "mathematics", "science"]
exclude = ["A?ENTS.md", "evidence/", "proptest-regressions/", "benchmark_python.py", "generate_fixtures.py", "run_benchmarks.py"]

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
num-bigint = "0.4"
num-traits = "0.2"
rayon = { version = "1.12", optional = true }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[[bin]]
name = "ergo-comp"
path = "src/bin/ergo-comp.rs"

[[bench]]
name = "scheduler_locality"
harness = false

[[bench]]
name = "defect_augmentation"
harness = false

[[bench]]
name = "balanced_frontend"
harness = false

[[bench]]
name = "parallel_kernels"
harness = false
required-features = ["parallel"]

[[bench]]
name = "balanced_parallel"
harness = false
required-features = ["parallel"]


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
