<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">ergodis speedup over structured CP-SAT</title>
  <desc id="desc">Horizontal logarithmic bars show ergodis speedups of 2.465 times on the shell large-box profile, 268.441 times on balanced, 372.846 times on small-state, and 19.697 times on large nonuniform.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .title { font: 700 26px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px system-ui, sans-serif; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 5 5; }
      .tick { font: 13px system-ui, sans-serif; fill: #475569; }
      .profile { font: 600 15px system-ui, sans-serif; fill: #0f172a; }
      .value { font: 700 15px system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1100" height="520" rx="20" fill="#f8fafc"/>
  <text x="55" y="44" class="title">Bounded scheduler profiles versus structured CP-SAT</text>
  <text x="55" y="68" class="subtitle">ergodis speedup; logarithmic scale; 11-round rotated warm-solve comparison</text>

  <line x1="250" y1="420" x2="1010" y2="420" class="axis"/>
  <line x1="250" y1="92" x2="250" y2="420" class="grid"/>
  <line x1="503" y1="92" x2="503" y2="420" class="grid"/>
  <line x1="757" y1="92" x2="757" y2="420" class="grid"/>
  <line x1="1010" y1="92" x2="1010" y2="420" class="grid"/>
  <g class="tick" text-anchor="middle">
    <text x="250" y="447">1×</text><text x="503" y="447">10×</text>
    <text x="757" y="447">100×</text><text x="1010" y="447">1000×</text>
  </g>

  <g>
    <text x="230" y="138" text-anchor="end" class="profile">shell large-box</text>
    <rect x="250" y="112" width="99" height="38" rx="8" fill="url(#bar)"/>
    <text x="361" y="137" class="value">2.465×</text>

    <text x="230" y="218" text-anchor="end" class="profile">balanced</text>
    <rect x="250" y="192" width="615" height="38" rx="8" fill="url(#bar)"/>
    <text x="877" y="217" class="value">268.441×</text>

    <text x="230" y="298" text-anchor="end" class="profile">small-state</text>
    <rect x="250" y="272" width="651" height="38" rx="8" fill="url(#bar)"/>
    <text x="913" y="297" class="value">372.846×</text>

    <text x="230" y="378" text-anchor="end" class="profile">large nonuniform</text>
    <rect x="250" y="352" width="328" height="38" rx="8" fill="url(#bar)"/>
    <text x="590" y="377" class="value">19.697×</text>
  </g>

  <text x="630" y="486" text-anchor="middle" class="subtitle">Same canonicalized options and exact optimum; structured CP-SAT uses one deterministic worker and a reused model.</text>
</svg>
