<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">ergodis exact benchmark highlights</title>
  <desc id="desc">Horizontal logarithmic bars compare ergodis with matched exact controls on distributed repair, cloud repair batching, sparse graph-code search, scheduling, checkpoint recovery, and hierarchical finite-field recovery.</desc>
  <defs>
    <linearGradient id="application-bar" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="theorem-bar" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <style>
      .title { font: 700 28px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px system-ui, sans-serif; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 5 5; }
      .tick { font: 13px system-ui, sans-serif; fill: #475569; }
      .profile { font: 600 15px system-ui, sans-serif; fill: #0f172a; }
      .control { font: 12px system-ui, sans-serif; fill: #64748b; }
      .value { font: 700 15px system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1200" height="610" rx="20" fill="#f8fafc"/>
  <text x="55" y="45" class="title">How much faster ergodis is than matched exact controls</text>
  <text x="55" y="70" class="subtitle">Longer bars mean larger ergodis speedups; construction time included; logarithmic scale</text>

  <line x1="315" y1="530" x2="1135" y2="530" class="axis"/>
  <g class="grid">
    <line x1="315" y1="95" x2="315" y2="530"/>
    <line x1="452" y1="95" x2="452" y2="530"/>
    <line x1="588" y1="95" x2="588" y2="530"/>
    <line x1="725" y1="95" x2="725" y2="530"/>
    <line x1="862" y1="95" x2="862" y2="530"/>
    <line x1="998" y1="95" x2="998" y2="530"/>
    <line x1="1135" y1="95" x2="1135" y2="530"/>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="315" y="555">1×</text><text x="452" y="555">10×</text>
    <text x="588" y="555">100×</text><text x="725" y="555">1,000×</text>
    <text x="862" y="555">10,000×</text><text x="998" y="555">100,000×</text>
    <text x="1135" y="555">1,000,000×</text>
  </g>

  <g>
    <text x="295" y="126" text-anchor="end" class="profile">Distributed XOR repair</text>
    <text x="295" y="145" text-anchor="end" class="control">Graphillion decision diagram</text>
    <rect x="315" y="112" width="123" height="30" rx="7" fill="url(#application-bar)"/>
    <text x="448" y="133" class="value">8×</text>

    <text x="295" y="196" text-anchor="end" class="profile">Published cloud repair code</text>
    <text x="295" y="215" text-anchor="end" class="control">direct CP-SAT</text>
    <rect x="315" y="182" width="360" height="30" rx="7" fill="url(#application-bar)"/>
    <text x="685" y="203" class="value">432×</text>

    <text x="295" y="266" text-anchor="end" class="profile">GPU checkpoint recovery</text>
    <text x="295" y="285" text-anchor="end" class="control">OR-Tools network flow</text>
    <rect x="315" y="252" width="412" height="30" rx="7" fill="url(#application-bar)"/>
    <text x="737" y="273" class="value">1,029×</text>

    <text x="295" y="336" text-anchor="end" class="profile">Dependent repair schedule</text>
    <text x="295" y="355" text-anchor="end" class="control">CP-SAT scheduling model</text>
    <rect x="315" y="322" width="533" height="30" rx="7" fill="url(#application-bar)"/>
    <text x="858" y="343" class="value">7,881×</text>

    <text x="295" y="406" text-anchor="end" class="profile">Cloud repair batch</text>
    <text x="295" y="425" text-anchor="end" class="control">HiGHS integer model</text>
    <rect x="315" y="392" width="716" height="30" rx="7" fill="url(#application-bar)"/>
    <text x="1041" y="413" class="value">174,000×</text>

    <text x="295" y="476" text-anchor="end" class="profile">Hierarchical finite-field recovery</text>
    <text x="295" y="495" text-anchor="end" class="control">direct CP-SAT, 4,096 leaves</text>
    <rect x="315" y="462" width="757" height="30" rx="7" fill="url(#theorem-bar)"/>
    <text x="1082" y="483" class="value">344,300×</text>
  </g>

  <text x="725" y="588" text-anchor="middle" class="subtitle">1,000× means the matched control took 1,000 times as long to return the same exact result.</text>
</svg>
