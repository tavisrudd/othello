[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ergodis"
version = "0.1.0"
description = "Typed Python 3.14+ client for Ergodis exact primitives"
requires-python = ">=3.14"
license = "AGPL-3.0-only"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["ergodis", "tests"]
