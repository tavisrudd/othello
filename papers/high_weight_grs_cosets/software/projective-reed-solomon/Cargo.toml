[package]
name = "projective-reed-solomon"
version = "0.1.0"
edition = "2021"
description = "Proof-carrying structural decoder for full-length projective Reed-Solomon syndromes"
license = "MIT"
rust-version = "1.93"
readme = "README.md"
repository = "https://github.com/tavisrudd/high-weight-grs-cosets"
keywords = ["coding-theory", "reed-solomon", "finite-fields", "certificates"]
categories = ["algorithms", "mathematics", "command-line-utilities"]

[lib]
name = "projective_reed_solomon"
path = "src/lib.rs"

[[bin]]
name = "projective-reed-solomon"
path = "src/main.rs"

[[bin]]
name = "projective-reed-solomon-benchmark"
path = "src/bin/projective_reed_solomon_benchmark.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1.11"
tempfile = "3"
